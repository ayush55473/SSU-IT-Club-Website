<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <!-- Tech Innovation Workshop Artwork -->
  <defs>
    <linearGradient id="bgGrad1" x1="0" y1="0" x2="600" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDFBF9" />
      <stop offset="100%" stop-color="#F7EFE9" />
    </linearGradient>
    <linearGradient id="glowGrad1" x1="200" y1="100" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#AE7B29" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#672C1C" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#bgGrad1)" />
  <circle cx="300" cy="190" r="140" fill="url(#glowGrad1)" />
  
  <!-- Subtle Grid lines -->
  <path d="M50 190H550 M300 40V340" stroke="#672C1C" stroke-opacity="0.08" stroke-dasharray="6 6" />
  
  <!-- Isometric Tech & Innovation Motif -->
  <g transform="translate(300, 190)">
    <!-- Outer Golden Ring -->
    <circle cx="0" cy="0" r="100" stroke="#AE7B29" stroke-width="2" stroke-dasharray="8 8" />
    <circle cx="0" cy="0" r="75" stroke="#672C1C" stroke-width="1.5" stroke-opacity="0.3" />
    
    <!-- Central Cube / Tech Hub -->
    <path d="M0 -50 L43 -25 L43 25 L0 50 L-43 25 L-43 -25 Z" fill="#672C1C" />
    <path d="M0 -50 L43 -25 L0 0 L-43 -25 Z" fill="#AE7B29" fill-opacity="0.9" />
    <path d="M0 0 L43 -25 L43 25 L0 50 Z" fill="#672C1C" fill-opacity="0.8" />
    <path d="M0 0 L-43 -25 L-43 25 L0 50 Z" fill="#4B1F13" />

    <!-- Innovation Spark -->
    <circle cx="0" cy="0" r="14" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="8" fill="#AE7B29" />
    
    <!-- Orbiting nodes -->
    <circle cx="100" cy="0" r="8" fill="#AE7B29" />
    <circle cx="-50" cy="86" r="6" fill="#672C1C" />
    <circle cx="-50" cy="-86" r="7" fill="#AE7B29" />
  </g>
  
  <rect x="24" y="24" width="130" height="28" rx="6" fill="#672C1C" />
  <text x="89" y="42" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">HANDS-ON LAB</text>
</svg>

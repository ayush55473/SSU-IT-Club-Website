<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <!-- Student Creativity Showcase Artwork -->
  <defs>
    <linearGradient id="bgShowcase" x1="0" y1="0" x2="600" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCFAF8" />
      <stop offset="100%" stop-color="#F6EFEA" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#bgShowcase)" />
  
  <g transform="translate(300, 185)">
    <!-- Palette, UI Wireframe & Lightbulb/Spark -->
    <rect x="-65" y="-55" width="130" height="90" rx="10" fill="#672C1C" />
    <rect x="-55" y="-45" width="110" height="70" rx="6" fill="#FFFFFF" />
    <!-- App UI wireframe elements inside screen -->
    <rect x="-45" y="-35" width="30" height="6" rx="2" fill="#AE7B29" />
    <rect x="-45" y="-22" width="50" height="4" rx="2" fill="#672C1C" fill-opacity="0.3" />
    <rect x="-45" y="-14" width="40" height="4" rx="2" fill="#672C1C" fill-opacity="0.2" />
    <circle cx="35" cy="-25" r="12" fill="#AE7B29" fill-opacity="0.2" />
    <path d="M-45 10 L-20 -5 L0 15 L25 -10 L45 10" stroke="#672C1C" stroke-width="2" stroke-linecap="round" />
    <!-- Floating creative shapes -->
    <circle cx="-85" cy="-30" r="10" fill="#AE7B29" />
    <polygon points="85,-40 95,-20 75,-20" fill="#672C1C" />
    <rect x="75" y="25" width="16" height="16" rx="4" fill="#AE7B29" transform="rotate(25 75 25)" />
    <!-- Stand -->
    <rect x="-20" y="35" width="40" height="10" rx="2" fill="#AE7B29" />
    <rect x="-35" y="45" width="70" height="6" rx="3" fill="#672C1C" />
  </g>
  
  <rect x="24" y="24" width="115" height="28" rx="6" fill="#672C1C" />
  <text x="81" y="42" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">EXHIBITION</text>
</svg>

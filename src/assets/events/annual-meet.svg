<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <!-- Annual IT Club Meet Artwork -->
  <defs>
    <linearGradient id="bgAnnual" x1="0" y1="0" x2="600" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCFAF7" />
      <stop offset="100%" stop-color="#F4ECE3" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#bgAnnual)" />
  
  <g transform="translate(300, 180)">
    <!-- Celebration, Conference, Community -->
    <circle cx="0" cy="0" r="115" stroke="#672C1C" stroke-width="1.5" stroke-opacity="0.15" />
    <circle cx="0" cy="0" r="85" stroke="#AE7B29" stroke-width="2" stroke-dasharray="6 6" />
    
    <!-- Central Community Medallion -->
    <circle cx="0" cy="0" r="50" fill="#672C1C" />
    <!-- 3 People / Community figures -->
    <!-- Center Person -->
    <circle cx="0" cy="-18" r="10" fill="#AE7B29" />
    <path d="M-18 16 C-18 2 -10 -4 0 -4 C10 -4 18 2 18 16 Z" fill="#AE7B29" />
    <!-- Left Person -->
    <circle cx="-25" cy="-8" r="7" fill="#FFFFFF" fill-opacity="0.8" />
    <path d="M-38 20 C-38 10 -32 5 -25 5 C-20 5 -16 8 -14 12" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <!-- Right Person -->
    <circle cx="25" cy="-8" r="7" fill="#FFFFFF" fill-opacity="0.8" />
    <path d="M38 20 C38 10 32 5 25 5 C20 5 16 8 14 12" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    
    <!-- Floating ribbons / celebration stars -->
    <circle cx="-65" cy="-55" r="5" fill="#AE7B29" />
    <circle cx="70" cy="-45" r="6" fill="#672C1C" />
    <circle cx="80" cy="40" r="4" fill="#AE7B29" />
    <circle cx="-75" cy="45" r="5" fill="#AE7B29" />
  </g>
  
  <rect x="24" y="24" width="130" height="28" rx="6" fill="#AE7B29" />
  <text x="89" y="42" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">CAMPUS GALA</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <!-- Inter-College Quiz Competition Artwork -->
  <defs>
    <linearGradient id="bgQuiz" x1="0" y1="0" x2="600" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCFAF7" />
      <stop offset="100%" stop-color="#F5ECE4" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#bgQuiz)" />
  <circle cx="300" cy="190" r="130" stroke="#AE7B29" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="6 6" />
  
  <g transform="translate(300, 180)">
    <!-- Trophy / Podium & Tech Sparks -->
    <path d="M-40 -40 L40 -40 L28 10 C24 30 10 40 0 45 C-10 40 -24 30 -28 10 Z" fill="#672C1C" />
    <path d="M-15 45 L15 45 L25 75 L-25 75 Z" fill="#AE7B29" />
    <rect x="-35" y="75" width="70" height="15" rx="3" fill="#672C1C" />
    <!-- Golden Star / Badge -->
    <circle cx="0" cy="-5" r="14" fill="#AE7B29" />
    <path d="M0 -11 L2 -5 L8 -5 L3 -1 L5 5 L0 2 L-5 5 L-3 -1 L-8 -5 L-2 -5 Z" fill="#FFFFFF" />
    <!-- Tech waves / quiz buzzer lines -->
    <path d="M-60 -20 C-75 -35 -75 5 -60 -5" stroke="#AE7B29" stroke-width="3" stroke-linecap="round" />
    <path d="M60 -20 C75 -35 75 5 60 -5" stroke="#AE7B29" stroke-width="3" stroke-linecap="round" />
  </g>
  
  <rect x="24" y="24" width="120" height="28" rx="6" fill="#AE7B29" />
  <text x="84" y="42" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">CHAMPIONSHIP</text>
</svg>

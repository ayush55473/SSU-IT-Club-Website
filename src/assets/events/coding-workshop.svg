<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <!-- Coding and Problem-Solving Workshop Artwork -->
  <defs>
    <linearGradient id="bgCode" x1="0" y1="0" x2="600" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#F2E8DE" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#bgCode)" />
  
  <g transform="translate(300, 180)">
    <!-- Terminal Editor Mockup -->
    <rect x="-80" y="-60" width="160" height="100" rx="8" fill="#672C1C" />
    <rect x="-80" y="-60" width="160" height="20" rx="8" fill="#4B1F13" />
    <circle cx="-65" cy="-50" r="3" fill="#AE7B29" />
    <circle cx="-55" cy="-50" r="3" fill="#FFFFFF" fill-opacity="0.4" />
    <circle cx="-45" cy="-50" r="3" fill="#FFFFFF" fill-opacity="0.2" />
    
    <!-- Code brackets & logic flow -->
    <text x="-65" y="-20" font-family="'JetBrains Mono', monospace" font-size="12" fill="#AE7B29" font-weight="600">&lt;ITClub.solve&gt;</text>
    <text x="-50" y="-2" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FFFFFF" fill-opacity="0.9">const ideas = innovate();</text>
    <text x="-50" y="14" font-family="'JetBrains Mono', monospace" font-size="10" fill="#AE7B29">return build(ideas);</text>
    <text x="-65" y="30" font-family="'JetBrains Mono', monospace" font-size="12" fill="#AE7B29" font-weight="600">&lt;/ITClub.solve&gt;</text>
    
    <!-- Laptop Base -->
    <path d="M-95 40 L95 40 L80 48 L-80 48 Z" fill="#AE7B29" />
    <rect x="-20" y="41" width="40" height="3" rx="1.5" fill="#672C1C" />
  </g>
  
  <rect x="24" y="24" width="140" height="28" rx="6" fill="#672C1C" />
  <text x="94" y="42" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">DEV BOOTCAMP</text>
</svg>
